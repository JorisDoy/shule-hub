name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Report build errors as annotations
        if: failure()
        run: python3 ../.github/scripts/maven-annotations.py build.log
      - name: Upload build log and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/build.log
            backend/target/surefire-reports

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
